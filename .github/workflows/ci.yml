name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_ticketing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d event_ticketing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/event_ticketing
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
      FRONTEND_URL: http://localhost:3000
      PAYSTACK_SECRET_KEY: sk_test_ci-placeholder
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
